$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: champion
endpoint_name: charge-ops-diagnosis
model: azureml:diagnosis@champion
environment: azureml:charge-ops-train:1
code_configuration:
  code: ../../src
  scoring_script: cpa/service/score.py
instance_type: Standard_DS2_v2
instance_count: 2
request_settings: {request_timeout_ms: 2000, max_concurrent_requests_per_instance: 8}
liveness_probe: {initial_delay: 20}
