# Held-out fleet: a winter with half the technicians (hiring freeze, sick leave), slow icy roads,
# shorter working days and a parts supply chain that takes one to two weeks. Field capacity is the
# binding constraint. No firmware release in this fleet carries a bug.

seed: 6730
start: "2025-11-03"          # a Monday
history_days: 84
test_days: 28

fleet:
  chargers: 900
  countries:
    DE: {share: 0.24, utc: 1, lang: de, technicians: 3}
    GB: {share: 0.14, utc: 0, lang: en, technicians: 2}
    IT: {share: 0.10, utc: 1, lang: it, technicians: 2}
    NL: {share: 0.08, utc: 1, lang: nl, technicians: 1}
    SE: {share: 0.07, utc: 1, lang: sv, technicians: 1}
    DK: {share: 0.07, utc: 1, lang: da, technicians: 1}
    PL: {share: 0.08, utc: 1, lang: pl, technicians: 1}
    CZ: {share: 0.06, utc: 1, lang: cs, technicians: 1}
    AT: {share: 0.06, utc: 1, lang: de, technicians: 1}
    HU: {share: 0.05, utc: 1, lang: hu, technicians: 1}
    RO: {share: 0.05, utc: 2, lang: ro, technicians: 1}
  chargers_per_site: [1, 6]
  site_radius_km: 170

models:
  HPC-350:   {vendor: Alpenstrom, kind: HPC, kw: 350, connectors: 2, share: 0.22, sessions_per_day: 10, firmware: ["3.4.2", "3.5.0"]}
  DC-150:    {vendor: Nordvolt,   kind: DC,  kw: 150, connectors: 2, share: 0.30, sessions_per_day: 8,  firmware: ["2.11.0", "2.12.1"]}
  DC-60:     {vendor: Kestrel,    kind: DC,  kw: 60,  connectors: 2, share: 0.18, sessions_per_day: 5,  firmware: ["1.9.7"]}
  AC-22:     {vendor: Volta,      kind: AC,  kw: 22,  connectors: 2, share: 0.30, sessions_per_day: 3,  firmware: ["5.0.3", "5.1.0"]}

drivers:
  auth_mix: {rfid: 0.42, app: 0.38, contactless: 0.20}
  retry_after_failure: 0.3
  complaint_per_failure: 0.05
  hourly_profile: [0.15, 0.1, 0.1, 0.1, 0.15, 0.3, 0.65, 1.0, 1.2, 1.2, 1.2, 1.3,
                   1.4, 1.3, 1.3, 1.4, 1.6, 1.7, 1.6, 1.3, 1.0, 0.7, 0.45, 0.25]
  weekend_factor: 0.8
  site_demand_sd: 0.45
  kwh_per_session: {HPC: 42, DC: 30, AC: 13}   # cold batteries take more energy
  revenue_per_kwh_eur: 0.64

hazard_scale: 0.8
faults:
  controller_hang:
    hazard: {HPC-350: 0.6, DC-150: 0.8, DC-60: 0.65, AC-22: 0.4}
    effect: {start_fails: 0.97}
    signals: {watchdog_event: 0.55}
    remedies: {evse_reset: 0.88, station_reset: 0.95}
    natural_end_hours: 120
    part: null
  connector_lock:
    hazard: {HPC-350: 0.35, DC-150: 0.5, DC-60: 0.4, AC-22: 0.55}   # frozen locks
    effect: {connector_faulted: true}
    tech_codes: {HPC-350: "E-LCK-31", DC-150: "0x2A07", DC-60: "LOCK_TIMEOUT", AC-22: "F17"}
    remedies: {unlock: 0.55, evse_reset: 0.15, station_reset: 0.2}
    natural_end_hours: 300
    part: lock_actuator
  power_module:
    hazard: {HPC-350: 0.28, DC-150: 0.2, DC-60: 0.16, AC-22: 0.0}
    onset_days: [3, 8]
    effect: {derate_to: 0.55, then: charger_faulted}
    signals: {temperature_rise_c: 18}
    tech_codes: {HPC-350: "E-PWR-12", DC-150: "0x3110", DC-60: "PM_OVERTEMP"}
    remedies: {evse_reset: 0.05, station_reset: 0.08, relief_hours: 6, relief: 0.65}
    natural_end_hours: null
    part: power_module
  rfid_reader:
    hazard: {HPC-350: 0.18, DC-150: 0.28, DC-60: 0.3, AC-22: 0.32}
    effect: {rfid_fails: 1.0}
    remedies: {evse_reset: 0.25, station_reset: 0.45}
    natural_end_hours: null
    part: rfid_reader
  payment_terminal:
    hazard: {HPC-350: 0.3, DC-150: 0.35, DC-60: 0.25, AC-22: 0.0}
    effect: {contactless_fails: 1.0}
    signals: {terminal_event: 0.3}
    tech_codes: {HPC-350: "PT-OFFLINE", DC-150: "PT-OFFLINE", DC-60: "PT-OFFLINE"}
    remedies: {evse_reset: 0.55, station_reset: 0.6}
    natural_end_hours: 200
    part: payment_terminal
  cable_wear:
    hazard: {HPC-350: 0.16, DC-150: 0.18, DC-60: 0.14, AC-22: 0.06}   # stiff cables crack in the cold
    effect: {ev_comm_fails: 0.45}
    remedies: {evse_reset: 0.03, station_reset: 0.03}
    natural_end_hours: null
    part: cable
  isolation_fault:
    hazard: {HPC-350: 0.07, DC-150: 0.09, DC-60: 0.08, AC-22: 0.05}
    effect: {charger_faulted: true}
    tech_codes: {HPC-350: "E-ISO-02", DC-150: "0x1F01", DC-60: "GROUND_FAULT", AC-22: "F03"}
    unsafe_to_reset: true
    remedies: {evse_reset: 0.0, station_reset: 0.0}
    natural_end_hours: null
    part: cable
  comm_loss:
    hazard: {HPC-350: 0.25, DC-150: 0.3, DC-60: 0.35, AC-22: 0.4}
    effect: {offline: true, still_charges: 0.7}
    remedies: {}
    natural_end_hours: 36
    part: modem
  grid_outage:
    hazard_per_site: 0.12
    duration_hours: [2, 14]
    effect: {offline: true, still_charges: 0.0}
    part: null

firmware_rollouts:
  - {model: DC-150,  version: "2.12.1", day: 50, share_per_day: 0.08, bug: null}
  - {model: HPC-350, version: "3.5.0",  day: 88, share_per_day: 0.12, bug: null}   # clean this time
rollback_remedies: {firmware_rollback: 0.97}

field_service:
  workday_local: [8, 16]
  workdays: [0, 1, 2, 3, 4]
  speed_kmh: 55
  visit_hours: {diagnose: 1.0, repair: 1.5}
  van_stock: {lock_actuator: 0.5, power_module: 0.1, rfid_reader: 0.4, payment_terminal: 0.3,
              cable: 0.3, modem: 0.6}
  part_lead_days: {lock_actuator: 5, power_module: 12, rfid_reader: 6, payment_terminal: 7, cable: 9, modem: 4}
  visit_cost_eur: 280
  km_cost_eur: 0.5
  note_language_local: 0.8
  note_cause_wrong: 0.1
  structured_part_field: 0.55

untrusted_text:
  injection_share: 0.02
