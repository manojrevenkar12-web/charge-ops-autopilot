[project]
name = "charge-ops-autopilot"
version = "0.1.0"
description = "AI operations for a pan-European charge-point fleet: OCPP 2.0.1, models in production, an agent that acts within a shield, an LLM gateway, dispatch optimisation."
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.3",
  "polars>=1.30",
  "pyarrow>=20",
  "pandas>=2.3",
  "scikit-learn>=1.7",
  "lightgbm>=4.6",
  "onnxruntime>=1.22",
  "onnxmltools>=1.14",
  "skl2onnx>=1.19",
  "mlflow-skinny>=3.1",
  "ocpp>=2.0",
  "websockets>=15",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pyyaml>=6",
  "typer>=0.16",
  "psycopg[binary]>=3.2",
  "redis>=6",
  "ortools>=9.14",
  "bm25s>=0.2",
  "opentelemetry-sdk>=1.36",
  "langgraph>=1.0",
  "anthropic>=0.60",
  "openai>=1.99",
  "scipy>=1.16",
  "sqlalchemy>=2.1.6",
  "alembic>=1.20.1",
]

[project.scripts]
cpa = "cpa.cli:app"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "hypothesis>=6.136", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: needs PostgreSQL", "slow: simulates days of the fleet"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"src/cpa/sim/texts.py" = ["E501"]   # sentences in ten languages
"src/cpa/gateway/prompts.py" = ["E501"]
"src/cpa/gateway/providers.py" = ["E501"]   # complaint phrases in ten languages
"tests/*" = ["RUF059"]
